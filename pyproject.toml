[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "THBDiff"
version = "0.1"
authors = [{name = "Ajith Moola", email = "arma@iastate.edu"}]
dependencies = ["numpy", "pybind11>=2.10.0"]
description = "Volumetric parametrization module"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["THBDiff"]

[tool.setuptools.package-data]
THBDiff = ["*.so", "*.pyd"]